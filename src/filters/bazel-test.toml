[[tests.bazel-test]]
name = "coverage output strips like test"
input = """
[4 / 9] Testing //pkg:a_test
//pkg:a_test PASSED in 0.5s
//pkg:b_test FAILED in 0.7s
"""
expected = "//pkg:b_test FAILED in 0.7s"
